# Weekly check for Boltz-2 upstream commits past our pinned build.
#
# Boltz-2 is pinned to an exact commit in modal_app.py AND pyproject.toml's `[gpu]` extra so the benchmark record stays reproducible (Process/boltz-version-pin.md).
# The cost of pinning is that upstream fixes are invisible until someone looks — this is the
# automated look. It also cross-checks that our exact dependency pins still agree with
# Boltz's own, since a disagreement makes `[gpu]` installs unresolvable (Process/pyproject.md).
#
# Report-only by design: it never bumps the pin. Adopting a bump requires re-running the
# CASP15 baseline, which is a human decision, not something a cron job should trigger.
name: Boltz-2 version check

on:
  schedule:
    # Mondays 14:00 UTC = 9am America/Chicago (CDT) / 8am (CST — cron is fixed UTC, so this
    # shifts by an hour across DST; harmless for a weekly check).
    - cron: "0 14 * * 1"
  workflow_dispatch:        # lets you run it on demand from the Actions tab

permissions:
  contents: read            # checkout only
  issues: write             # open/comment the report issue

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # No pip install step: check_boltz_updates.py is deliberately stdlib-only
      # (urllib/json/re/argparse) so this job needs no dependencies.

      - name: Check for upstream Boltz-2 commits
        id: check
        env:
          # Lifts the unauthenticated GitHub API limit (60/hr) to 1000/hr for this repo.
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 scripts/check_boltz_updates.py --json > result.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat result.json

      - name: Summarise in the run log
        if: always()
        run: |
          {
            echo "### Boltz-2 version check"
            echo ""
            echo "Exit code: \`${{ steps.check.outputs.exit_code }}\` "
            echo "(0 = up to date, 1 = behind upstream, 2 = could not determine)"
            echo ""
            echo '```json'
            cat result.json 2>/dev/null || echo "(no output — the script failed to run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Exit 0 is the expected weekly outcome and stays silent — a notification every week
      # for "nothing changed" is a notification nobody reads.
      - name: Open or update the report issue
        if: steps.check.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let data = null;
            try {
              data = JSON.parse(fs.readFileSync('result.json', 'utf8'));
            } catch (e) {
              core.warning(`could not parse result.json: ${e}`);
            }

            const failed = '${{ steps.check.outputs.exit_code }}' === '2';
            const MARKER = '<!-- boltz-version-check -->';   // identifies our own issue

            // Renders a {pkg: {ours, boltz}} map as a table. Used for both the
            // broken-right-now case and the "this bump would also need these" warning.
            const depTable = (obj) => [
              '| package | ours | Boltz |',
              '|---|---|---|',
              ...Object.entries(obj).map(([k, v]) => `| \`${k}\` | \`==${v.ours}\` | \`==${v.boltz}\` |`),
            ].join('\n');

            // Exit 2 can now arrive WITH valid JSON: a dependency-pin conflict is a real
            // finding, not a failure to measure, so don't discard the detail as "unknown".
            const conflicts = (data && data.dep_conflicts_at_pinned) || {};
            const hasConflicts = Object.keys(conflicts).length > 0;

            let title, body, stateKey;

            if (hasConflicts) {
              title = 'Boltz-2 pin check FAILED — our dependency pins conflict with Boltz';
              body = [
                MARKER,
                '## `[gpu]` installs cannot resolve',
                '',
                'We pin these packages to versions that differ from the **pinned Boltz commit\'s own**',
                'hard `==` pins, so `pip install ".[gpu]"` fails with `ResolutionImpossible`:',
                '',
                depTable(conflicts),
                '',
                'Fix: move ours to Boltz\'s versions in **`pyproject.toml` and `requirements.txt`**.',
                'See `Process/pyproject.md`.',
                '',
                `_Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}_`,
                // Dedupe on the conflict itself, so a *different* conflict still reports.
                `<!-- state: deps:${Object.entries(conflicts).map(([k, v]) => `${k}=${v.ours}/${v.boltz}`).sort().join(',')} -->`,
              ].join('\n');
              stateKey = `deps:${Object.entries(conflicts).map(([k, v]) => `${k}=${v.ours}/${v.boltz}`).sort().join(',')}`;
            } else if (failed || !data) {
              // Exit 2 without data: we could not measure. The nastiest case it covers is
              // the pin sites disagreeing — which means Modal and local GPU installs
              // would silently run different Boltz builds.
              title = 'Boltz-2 upstream check FAILED';
              body = [
                MARKER,
                '## Boltz-2 version check could not complete',
                '',
                'Exit code `2`. Causes, in order of seriousness:',
                '',
                '1. **The two pin sites disagree** (`modal_app.py`, `pyproject.toml`) — Modal runs and',
                '   `pip install -e ".[gpu]"` would use *different* Boltz builds.',
                '2. GitHub API unreachable or rate-limited.',
                '',
                'See the workflow run log for the exact message.',
                '',
                `_Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}_`,
              ].join('\n');
              stateKey = null;
            } else {
              const notable = data.notable_numerics_commits || [];
              const commits = (data.commits || [])
                .map(c => `- \`${c.sha}\` ${notable.includes(c.sha) ? '**⚠️ numerics** ' : ''}${c.subject}`)
                .join('\n');

              title = `Boltz-2 upstream update available — behind by ${data.behind_by} commit(s)`;
              body = [
                MARKER,
                `## Pinned build is ${data.behind_by} commit(s) behind upstream \`main\``,
                '',
                `| | |`,
                `|---|---|`,
                `| pinned | \`${data.pinned}\` |`,
                `| latest main | \`${data.latest_main}\` |`,
                `| latest release | ${data.latest_release || '—'} |`,
                '',
                '### New commits',
                commits || '_(none listed)_',
                '',
                notable.length
                  ? `### ⚠️ ${notable.length} commit(s) look numerics-related\nThese can move results. Treat a bump as a **new baseline**, not a free upgrade.`
                  : '_No commits flagged as numerics-related._',
                '',
                Object.keys(data.dep_conflicts_if_bumped || {}).length
                  ? [
                      '### ⚠️ This bump also moves dependency pins',
                      'Boltz changed its own hard `==` pins. Bumping the SHA **without** moving these',
                      'makes `[gpu]` unresolvable:',
                      '',
                      depTable(data.dep_conflicts_if_bumped),
                    ].join('\n')
                  : '_This bump needs no dependency-pin changes._',
                '',
                '### Adopting this bump',
                '1. Update the SHA in **both** `modal_app.py` and `pyproject.toml` — they must stay in',
                '   lockstep.',
                '2. Move any dependency pins listed above in `pyproject.toml` **and** `requirements.txt`.',
                '3. Re-run the CASP15 baseline and log it as a **new run** in `benchmarks/BENCHMARKS.md`.',
                '4. Do **not** compare results across the version boundary.',
                '5. Never substitute `boltz==2.2.1` for the pinned commit — the version string does not',
                '   uniquely identify a build. See `Process/boltz-version-pin.md`.',
                '',
                `_Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}_`,
              ].join('\n');
              stateKey = data.latest_main;
            }

            // One issue per upstream state, not one per week: reuse our existing open issue
            // and only comment when the SHA it records has actually changed.
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const ours = existing.find(i => (i.body || '').includes(MARKER));

            if (!ours) {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body,
              });
              core.notice(`Opened issue #${created.data.number}`);
              return;
            }

            // One issue per upstream *state*: for a bump that's the latest SHA, for a pin
            // conflict it's the conflict itself. A null key (couldn't measure) never matches,
            // so those keep reporting.
            if (stateKey && (ours.body || '').includes(stateKey)) {
              core.notice(`Issue #${ours.number} already reports ${stateKey} — staying quiet.`);
              return;
            }

            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: ours.number, title, body,
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: ours.number,
              body: hasConflicts
                ? `${MARKER}\nDependency-pin conflict changed — updated above.`
                : `${MARKER}\nUpstream moved again — updated above to \`${data ? data.latest_main : 'n/a'}\`.`,
            });
            core.notice(`Updated issue #${ours.number}`);
